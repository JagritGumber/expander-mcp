[package]
name = "expander-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, local-first prompt expander for MCP clients"
license = "MIT"
repository = "https://github.com/JagritGumber/expander-mcp"
keywords = ["mcp", "prompt", "codex", "claude", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "expander-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
